name: Android Debug CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-debug.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:  # 允许手动触发

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept SDK licenses & ensure components
        run: |
          # ubuntu-latest 镜像已预装 ANDROID_HOME（android-actions/setup-android@v3 近期在
          # runner 镜像更新后持续失败，改为直接使用预装 SDK）
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --no-daemon > /tmp/gradle.log 2>&1 || (
            echo "### Gradle build failure (tail 150 lines)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 150 /tmp/gradle.log >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          )

      - name: Dump gradle log to ci-debug-log branch on failure
        if: failure()
        working-directory: ${{ github.workspace }}
        run: |
          tail -n 250 /tmp/gradle.log > gradle-failure.log || echo "no log" > gradle-failure.log
          git config user.name "ci-log-bot"
          git config user.email "ci@maozi.weather"
          git fetch origin ci-debug-log 2>/dev/null || true
          git checkout -B ci-debug-log
          git add gradle-failure.log
          git commit -m "ci: gradle failure log (${{ github.run_number }})"
          git push origin ci-debug-log --force

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          # 构建号随每次触发递增，便于测试区分不同批次安装包
          name: maozi-weather-debug-${{ github.run_number }}
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: android-app/app/build/reports/
          retention-days: 7
