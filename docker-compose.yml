version: "3.8"

services:
  # MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: maozi-mysql
    restart: unless-stopped
    ports:
      - "60241:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: maozi_weather
      MYSQL_USER: maozi
      MYSQL_PASSWORD: maozi123
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - maozi-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7
  redis:
    image: redis:7-alpine
    container_name: maozi-redis
    restart: unless-stopped
    ports:
      - "60242:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - maozi-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI 后端（可选，本地开发时可直接用 uvicorn）
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: maozi-backend
    restart: unless-stopped
    ports:
      - "60245:60245"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: maozi
      DB_PASSWORD: maozi123
      DB_NAME: maozi_weather
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_PORT: 60245
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - maozi-net
    profiles:
      - full  # 默认不启动，使用 docker-compose --profile full up

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  maozi-net:
    driver: bridge
